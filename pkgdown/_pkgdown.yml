reference:
  - title: "Package overview"
    contents:
      - tximeta-package
  - title: "Main import functions"
    contents:
      - tximeta
      - starts_with("summarizeToGene")
  - title: "linkedTxome: linking data to metadata"
    contents:
      - contains("linkedTx")
  - title: "Mixed reference transcripts"
    contents:
      - importData
      - inspectDigests
      - updateMetadata
  - title: "Add information to object"
    contents:
      - starts_with("add")
  - title: "Retrieve information from object"
    contents:
      - starts_with("retrieve")
  - title: "Other helpers"
    contents:
      - splitSE
      - makeDGEList
      - getTximetaBFC
